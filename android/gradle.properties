org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 禁用 Kotlin 增量编译，避免 daemon 被杀后缓存损坏导致编译失败
kotlin.incremental=false

# 本机 ~/.gradle/gradle.properties 配置了代理(127.0.0.1:7897)，但该代理无法正确
# 取回 Google Maven / Gradle 服务端产物（直连正常、走代理 404），导致依赖解析失败。
# 这里仅对构建所需仓库域名绕过代理，其余域名仍走代理。
systemProp.http.nonProxyHosts=localhost|127.*|[::1]|dl.google.com|*.google.com|maven.google.com|repo.maven.apache.org|repo1.maven.org|*.maven.org|plugins.gradle.org|*.gradle.org|pub.dev|*.pub.dev|*.flutter.dev
systemProp.https.nonProxyHosts=localhost|127.*|[::1]|dl.google.com|*.google.com|maven.google.com|repo.maven.apache.org|repo1.maven.org|*.maven.org|plugins.gradle.org|*.gradle.org|pub.dev|*.pub.dev|*.flutter.dev
